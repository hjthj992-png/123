<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

/* =========================================================
   Noise (tileable value noise + fbm)
   ========================================================= */
let SEED = 1;
function hash(i, j) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const wrap = (a, p) => (p ? ((a % p) + p) % p : a);
function vnoise(x, y, px, py) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const x0 = wrap(xi, px), x1 = wrap(xi + 1, px), y0 = wrap(yi, py), y1 = wrap(yi + 1, py);
  const a = hash(x0, y0), b = hash(x1, y0), c = hash(x0, y1), d = hash(x1, y1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function fbm(x, y, oct, px = 0, py = 0) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    s += a * vnoise(x * f, y * f, px * f, py * f);
    n += a; a *= 0.5; f *= 2;
  }
  return s / n;
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rand = (() => { let s = 7; return () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) + 0x9e3779b9 | 0) >>> 0) / 4294967296; })();
const rr = (a, b) => a + (b - a) * rand();

/* =========================================================
   Procedural textures → color map + bump map
   ========================================================= */
function makeTex(w, h, seed, fn) {
  SEED = seed;
  const c1 = document.createElement('canvas'); c1.width = w; c1.height = h;
  const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
  const g1 = c1.getContext('2d'), g2 = c2.getContext('2d');
  const d1 = g1.createImageData(w, h), d2 = g2.createImageData(w, h);
  const o = [0, 0, 0, 0];
  for (let y = 0; y < h; y++) {
    const v = 1 - (y + 0.5) / h;
    for (let x = 0; x < w; x++) {
      fn((x + 0.5) / w, v, o);
      const i = (y * w + x) * 4;
      d1.data[i] = o[0] * 255; d1.data[i + 1] = o[1] * 255; d1.data[i + 2] = o[2] * 255; d1.data[i + 3] = 255;
      d2.data[i] = d2.data[i + 1] = d2.data[i + 2] = o[3] * 255; d2.data[i + 3] = 255;
    }
  }
  g1.putImageData(d1, 0, 0); g2.putImageData(d2, 0, 0);
  const map = new THREE.CanvasTexture(c1); map.colorSpace = THREE.SRGBColorSpace;
  const bump = new THREE.CanvasTexture(c2);
  for (const t of [map, bump]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; }
  return { map, bump };
}

const GREEN = [0.27, 0.36, 0.30], BEIGE = [0.68, 0.64, 0.54], PLASTER = [0.72, 0.69, 0.61],
      CONC = [0.38, 0.35, 0.31], RUST = [0.40, 0.22, 0.10];

// Peeling two-tone Soviet wall: green lower band, beige upper, layers of flaking paint
function wallFn(split, peel, tone) {
  return (u, v, o) => {
    const zone = fbm(u * 4 + 11, v * 2, 3, 4);
    const big = fbm(u * 18, v * 9, 5, 18) + (zone - 0.5) * 0.12;
    const det = fbm(u * 90, v * 45, 3, 90);
    const gr  = fbm(u * 3 + 5, v * 1.6, 4, 3);
    const st  = fbm(u * 120, v * 1.4 + 2, 3, 120);
    const lower = v < split;
    const base = lower ? GREEN : BEIGE;
    const t = 0.56 + peel + (lower ? 0.02 : 0) - (gr - 0.5) * 0.3;
    let c, h;
    if (big < t - 0.012)      { c = base; h = 0.85 + det * 0.15; }
    else if (big < t)         { c = [base[0] * 1.28, base[1] * 1.25, base[2] * 1.2]; h = 1; }
    else if (big < t + 0.018) { c = [PLASTER[0] * 0.5, PLASTER[1] * 0.48, PLASTER[2] * 0.45]; h = 0.45; }
    else if (big < t + 0.08)  { c = PLASTER; h = 0.5; }
    else                      { c = CONC; h = 0.15 + det * 0.25; }
    const chip = fbm(u * 70, v * 35, 3, 70);
    if (h > 0.8 && chip > 0.7) { c = chip > 0.72 ? PLASTER : [base[0] * 0.6, base[1] * 0.6, base[2] * 0.6]; h = 0.55; }
    const k = 0.8 + det * 0.4;
    c = [c[0] * k, c[1] * k, c[2] * k];
    const s = smooth(0.6, 0.78, st) * smooth(0.4, 0.75, gr) * (0.35 + 0.65 * (1 - v));
    c = mix3(c, RUST, s * 0.8);
    let g = (0.5 + gr * 0.65) * tone;
    if (v < 0.1) g *= 0.55 + 4.5 * v;
    if (v > 0.94) g *= 1 - (v - 0.94) * 6;
    if (Math.abs(v - split) < 0.0035) g *= 0.5;
    o[0] = c[0] * g; o[1] = c[1] * g; o[2] = c[2] * g; o[3] = h;
  };
}

function ceilFn(u, v, o) {
  const big = fbm(u * 14, v * 14, 5, 14, 14), det = fbm(u * 50, v * 50, 3, 50, 50), gr = fbm(u * 3, v * 3 + 7, 4, 3, 3);
  const t = 0.5 - (gr - 0.5) * 0.3;
  let c, h;
  if (big < t - 0.02) { c = [0.52, 0.49, 0.43]; h = 0.9; }
  else if (big < t)   { c = [0.66, 0.63, 0.56]; h = 1; }
  else if (big < t + 0.03) { c = [0.2, 0.19, 0.17]; h = 0.4; }
  else { c = [0.34, 0.31, 0.27]; h = 0.3 * det; }
  const k = (0.75 + det * 0.4) * (0.45 + gr * 0.6);
  const s = smooth(0.62, 0.8, fbm(u * 8 + 3, v * 8, 3, 8, 8));
  c = mix3(c, [0.3, 0.2, 0.1], s * 0.6);
  o[0] = c[0] * k; o[1] = c[1] * k; o[2] = c[2] * k; o[3] = h;
}

function floorFn(u, v, o) {
  const a = fbm(u * 8, v * 8, 5, 8, 8), d = fbm(u * 64, v * 64, 3, 64, 64), w = fbm(u * 3 + 3, v * 3, 4, 3, 3);
  let c = mix3([0.22, 0.2, 0.17], [0.40, 0.36, 0.30], a);
  // ghost of old floor tiles
  const tu = u * 13, tv = v * 13;
  const e = Math.min(Math.abs(tu - Math.round(tu)), Math.abs(tv - Math.round(tv)));
  if (e < 0.035 && fbm(u * 20, v * 20, 2, 20, 20) > 0.45) c = mix3(c, [0.1, 0.09, 0.08], 0.6);
  c = mix3(c, [0.52, 0.48, 0.41], smooth(0.55, 0.78, w) * 0.5);        // dust
  const wet = smooth(0.6, 0.72, fbm(u * 5 + 9, v * 5, 3, 5, 5));
  const k = (0.78 + d * 0.44) * (1 - wet * 0.45);
  o[0] = c[0] * k; o[1] = c[1] * k; o[2] = c[2] * k; o[3] = a * 0.5 + d * 0.5;
}

// Painted metal eaten by rust
function rustFn(paint, thr) {
  return (u, v, o) => {
    const n = fbm(u * 9, v * 9, 5, 9, 9), d = fbm(u * 72, v * 72, 3, 72, 72), s = fbm(u * 40, v * 4, 3, 40, 4);
    const m = smooth(thr - 0.04, thr + 0.04, n + (s - 0.5) * 0.35);
    let r = mix3([0.22, 0.11, 0.05], [0.52, 0.28, 0.12], d);
    if (d < 0.32) r = [r[0] * 0.5, r[1] * 0.5, r[2] * 0.5];
    const p = [paint[0] * (0.8 + 0.3 * d), paint[1] * (0.8 + 0.3 * d), paint[2] * (0.8 + 0.3 * d)];
    const c = mix3(p, r, m);
    const g = 0.6 + 0.5 * fbm(u * 3, v * 3, 3, 3, 3);
    o[0] = c[0] * g; o[1] = c[1] * g; o[2] = c[2] * g; o[3] = 1 - m * 0.6 + d * 0.25;
  };
}

function woodFn(u, v, o) {
  const grain = fbm(u * 4, v * 60, 4, 4, 60), d = fbm(u * 40, v * 40, 3, 40, 40);
  const c = mix3([0.22, 0.17, 0.12], [0.42, 0.35, 0.27], grain);
  const k = 0.75 + d * 0.4;
  o[0] = c[0] * k; o[1] = c[1] * k; o[2] = c[2] * k; o[3] = grain;
}

/* =========================================================
   View outside: overcast sky, dead forest, the reactor block
   ========================================================= */
function drawTree(g, x, y, len, ang, depth, wid) {
  const x2 = x + Math.cos(ang) * len, y2 = y - Math.sin(ang) * len;
  g.lineWidth = wid; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  if (depth <= 0 || len < 2) return;
  const n = rand() < 0.35 ? 3 : 2;
  for (let i = 0; i < n; i++) {
    const a = ang + (i - (n - 1) / 2) * rr(0.35, 0.7) + rr(-0.15, 0.15);
    drawTree(g, x2, y2, len * rr(0.62, 0.8), a, depth - 1, wid * 0.68);
  }
}
function makeOutside() {
  const W = 2048, H = 1229, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const X = u => u * W, Y = v => (1 - v) * H;
  // sky
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#9da2a7'); sky.addColorStop(0.55, '#c9c8c2'); sky.addColorStop(1, '#d6d1c6');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // soft clouds
  const cc = document.createElement('canvas'); cc.width = 256; cc.height = 154;
  const cg = cc.getContext('2d'), id = cg.createImageData(256, 154); SEED = 31;
  for (let y = 0; y < 154; y++) for (let x = 0; x < 256; x++) {
    const n = fbm(x / 40, y / 22, 5), i = (y * 256 + x) * 4, a = smooth(0.45, 0.75, n);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = n > 0.6 ? 245 : 150; id.data[i + 3] = a * 120;
  }
  cg.putImageData(id, 0, 0); g.drawImage(cc, 0, 0, W, H * 0.7);

  const ground = 0.17;
  // far haze treeline
  g.strokeStyle = 'rgba(120,116,108,0.55)'; g.lineCap = 'round';
  for (let i = 0; i < 60; i++) drawTree(g, X(rand()), Y(ground + 0.02), rr(25, 45), Math.PI / 2 + rr(-0.1, 0.1), 6, 3);

  // reactor building complex
  const haze = (s) => `rgb(${s - 28},${s - 26},${s - 25})`;
  g.fillStyle = haze(170); g.fillRect(X(0.50), Y(0.26), X(0.58) - X(0.50), Y(ground) - Y(0.26));
  g.fillStyle = haze(150); g.fillRect(X(0.58), Y(0.34), X(0.74) - X(0.58), Y(ground) - Y(0.34));
  g.fillStyle = haze(158); g.fillRect(X(0.61), Y(0.39), X(0.72) - X(0.61), Y(0.34) - Y(0.39));
  g.fillStyle = haze(142); g.fillRect(X(0.74), Y(0.30), X(0.86) - X(0.74), Y(ground) - Y(0.30));
  // window rows and stains on the block
  g.fillStyle = 'rgba(90,92,92,0.35)';
  for (let r = 0; r < 6; r++) for (let k = 0; k < 40; k++)
    if (rand() < 0.7) g.fillRect(X(0.585 + k * 0.0038), Y(0.32 - r * 0.024), 5, 4);
  g.fillStyle = 'rgba(70,70,70,0.25)';
  for (let k = 0; k < 30; k++) g.fillRect(X(rr(0.5, 0.86)), Y(rr(0.2, 0.38)), 3, rr(20, 70));
  // ventilation stack with lattice
  const sx = X(0.665), sb = Y(0.39), st = Y(0.62), bw = 34, tw = 22;
  g.fillStyle = haze(145);
  g.beginPath(); g.moveTo(sx - bw / 2, sb); g.lineTo(sx - tw / 2, st); g.lineTo(sx + tw / 2, st); g.lineTo(sx + bw / 2, sb); g.fill();
  g.strokeStyle = 'rgba(95,97,98,0.9)'; g.lineWidth = 2;
  for (let y = st; y < sb; y += 18) {
    const k = (y - st) / (sb - st), hw = (tw + (bw - tw) * k) / 2 + 9;
    g.beginPath(); g.moveTo(sx - hw, y); g.lineTo(sx + hw, y); g.stroke();
    g.beginPath(); g.moveTo(sx - hw, y); g.lineTo(sx + hw, y + 18); g.moveTo(sx + hw, y); g.lineTo(sx - hw, y + 18); g.stroke();
  }
  g.beginPath(); g.moveTo(sx - bw / 2 - 9, sb); g.lineTo(sx - tw / 2 - 9, st); g.moveTo(sx + bw / 2 + 9, sb); g.lineTo(sx + tw / 2 + 9, st); g.stroke();
  g.fillStyle = haze(120); g.fillRect(sx - tw / 2 - 12, st - 10, tw + 24, 10);
  // atmospheric veil over the far layer
  g.fillStyle = 'rgba(225,222,214,0.28)'; g.fillRect(0, Y(0.8), W, Y(ground) - Y(0.8));

  // mid trees (dead, leafless)
  g.strokeStyle = 'rgba(78,70,62,0.85)';
  for (let i = 0; i < 18; i++) drawTree(g, X(rand() < 0.6 ? rr(0, 0.5) : rr(0.86, 1)), Y(ground), rr(60, 110), Math.PI / 2 + rr(-0.12, 0.12), 7, rr(5, 9));
  // near trees
  g.strokeStyle = 'rgba(45,38,32,0.95)';
  for (let i = 0; i < 6; i++) drawTree(g, X(rand() < 0.5 ? rr(0.3, 0.55) : rr(0.86, 1)), Y(ground - 0.04), rr(90, 150), Math.PI / 2 + rr(-0.15, 0.15), 8, rr(9, 15));
  // dry grass and shrubs
  g.fillStyle = '#5d4a32'; g.fillRect(0, Y(ground + 0.01), W, H);
  for (let i = 0; i < 9000; i++) {
    const x = rr(0, W), y = Y(rr(-0.05, ground + 0.03)), l = rr(10, 40);
    g.strokeStyle = rand() < 0.5 ? 'rgba(150,118,72,0.7)' : 'rgba(90,70,45,0.8)';
    g.lineWidth = rr(1, 2.5); g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-12, 12), y - l); g.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeSign() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#b8b2a2'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#1c1a17'; g.lineWidth = 12; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(128, 30); g.lineTo(230, 210); g.lineTo(26, 210); g.closePath(); g.stroke();
  g.fillStyle = '#1c1a17';
  g.beginPath(); g.moveTo(140, 80); g.lineTo(104, 150); g.lineTo(130, 150); g.lineTo(112, 196); g.lineTo(158, 126); g.lineTo(132, 126); g.lineTo(150, 80); g.closePath(); g.fill();
  SEED = 77; const id = g.getImageData(0, 0, 256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const i = (y * 256 + x) * 4, n = fbm(x / 30, y / 30, 4), r = smooth(0.58, 0.68, n);
    id.data[i] = id.data[i] * (1 - r) + 105 * r; id.data[i + 1] = id.data[i + 1] * (1 - r) + 58 * r; id.data[i + 2] = id.data[i + 2] * (1 - r) + 26 * r;
  }
  g.putImageData(id, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* =========================================================
   Scene
   ========================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a08);
scene.fog = new THREE.FogExp2(0x15120e, 0.05);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 160);
const CAM = new THREE.Vector3(0.35, 1.6, 3.4), LOOK = new THREE.Vector3(0.2, 1.3, -30);
camera.position.copy(CAM); camera.lookAt(LOOK);

// dimensions
const H = 3.3, HW = 2.1, Z0 = 5, Z1 = -34, T = 0.3;

function worldUV(geo, su, sv, ox = 0, oy = 0) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let U, V;
    if (ax >= ay && ax >= az) { U = z * su; V = y * sv; }
    else if (ay >= az) { U = x * su; V = z * su; }
    else { U = x * su; V = y * sv; }
    uv.setXY(i, U + ox, V + oy);
  }
  uv.needsUpdate = true;
}
function add(mesh, cast = true, recv = true) { mesh.castShadow = cast; mesh.receiveShadow = recv; scene.add(mesh); return mesh; }
function wbox(w, h, d, x, y, z, mat, su, sv, ox = 0, oy = 0) {
  const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); worldUV(g, su, sv, ox, oy);
  return add(new THREE.Mesh(g, mat));
}
function box(w, h, d, mat, x, y, z, ry = 0, rx = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz); return add(m);
}

/* ---------- materials ---------- */
const texWall  = makeTex(2048, 1024, 3, wallFn(0.44, 0.0, 1.0));
const texWall2 = makeTex(2048, 1024, 9, wallFn(0.44, -0.03, 0.85));
const texCeil  = makeTex(512, 512, 5, ceilFn);
const texFloor = makeTex(1024, 1024, 11, floorFn);
const texRad   = makeTex(256, 256, 13, rustFn([0.70, 0.66, 0.56], 0.55));
const texMetal = makeTex(256, 256, 17, rustFn([0.58, 0.58, 0.54], 0.6));
const texFrame = makeTex(256, 256, 19, rustFn([0.74, 0.72, 0.66], 0.5));
const texBarrel= makeTex(256, 256, 23, rustFn([0.22, 0.26, 0.28], 0.45));
const texRust  = makeTex(256, 256, 29, rustFn([0.30, 0.2, 0.12], 0.3));
const texCrate = makeTex(256, 256, 37, rustFn([0.33, 0.30, 0.24], 0.5));
const texLamp  = makeTex(256, 256, 41, rustFn([0.20, 0.26, 0.22], 0.5));
const texWood  = makeTex(128, 512, 43, woodFn);

const std = (t, rough = 0.92, metal = 0, bump = 0.015, extra = {}) =>
  new THREE.MeshStandardMaterial({ map: t.map, bumpMap: t.bump, bumpScale: bump, roughness: rough, metalness: metal, ...extra });
const mWall  = std(texWall, 0.95, 0, 1.6);
const mWall2 = std(texWall2, 0.95, 0, 1.6);
const mCeil  = std(texCeil, 0.97, 0, 1.4);
const mFloor = std(texFloor, 0.9, 0, 1.2);
const mRad   = std(texRad, 0.8, 0.25, 1.2);
const mMetal = std(texMetal, 0.75, 0.3, 1.2);
const mFrame = std(texFrame, 0.85, 0.15, 1.0);
const mBarrel= std(texBarrel, 0.7, 0.4, 1.4);
const mRust  = std(texRust, 0.7, 0.5, 1.2);

function shaft(z0, z1, y0, y1, len, strength = 1) {
  const x = -HW - T + 0.02;
  const base = [[x, y0, z0], [x, y0, z1], [x, y1, z1], [x, y1, z0]].map(a => new THREE.Vector3(...a));
  const tip = base.map(v => v.clone().addScaledVector(SUN_DIR, len));
  const pos = [], al = [];
  for (let i = 0; i < 4; i++) {
    const a = base[i], b = base[(i + 1) % 4], c = tip[(i + 1) % 4], d = tip[i];
    pos.push(...a, ...b, ...c, ...a, ...c, ...d); al.push(0, 0, 1, 0, 1, 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('along', new THREE.Float32BufferAttribute(al, 1));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, shaftMat); m.renderOrder = 5; scene.add(m);
}

      gl_Position = projectionMatrix * mv;
      gl_PointSize = uPx * (1.0 + fract(seed*7.3)*2.0) * (4.0 / -mv.z);
      vA = (0.35 + 0.65*fract(seed*3.1)) * smoothstep(12.0, 1.0, -mv.z) * (0.6 + 0.4*sin(uTime*0.8+seed*5.0));
    }`,
  fragmentShader: `
    varying float vA;
    void main(){ float d = length(gl_PointCoord-0.5); float a = smoothstep(0.5,0.0,d)*vA; gl_FragColor = vec4(vec3(1.0,0.86,0.66)*a*0.55, 1.0); }`,
});
scene.add(new THREE.Points(dustGeo, dustMat));

/* =========================================================
   Post: bloom, film grade, vignette, grain
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.299,0.587,0.114));
      c = mix(c, c*vec3(0.9,1.0,0.97), (1.0-l)*0.8);      // cool-green shadows
      c = mix(c, c*vec3(1.06,1.0,0.9), l*0.7);           // warm highlights
      c = mix(vec3(l), c, 0.88);                          // slight desaturation
      c = (c - 0.5) * 1.07 + 0.5;
      vec2 d = vUv - 0.5;
      c *= mix(0.45, 1.0, smoothstep(0.85, 0.2, length(d * vec2(1.0, 1.2))));
      c += (rnd(vUv * 1000.0 + fract(uTime) * 91.0) - 0.5) * 0.03;
      gl_FragColor = vec4(max(c, 0.0), 1.0);
    }`,
});
composer.addPass(grade);

/* =========================================================
   Camera feel + loop
   ========================================================= */
const mouse = new THREE.Vector2(), look = new THREE.Vector2();
addEventListener('pointermove', e => { mouse.set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); });
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.fov = w / h < 1 ? 82 : 60; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
}
addEventListener('resize', resize); resize();

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
let first = true;
function frame() {
  const t = clock.getElapsedTime();
  look.lerp(mouse, 0.04);
  const sway = reduce ? 0 : 1;
  camera.position.set(
    CAM.x + Math.sin(t * 0.31) * 0.025 * sway,
    CAM.y + Math.sin(t * 0.47) * 0.015 * sway,
    CAM.z);
  tmp.set(LOOK.x + look.x * 6 + Math.sin(t * 0.23) * 0.15 * sway, LOOK.y - look.y * 4 + Math.sin(t * 0.37) * 0.1 * sway, LOOK.z);
  camera.lookAt(tmp);
  lamp.rotation.z = Math.sin(t * 0.6) * 0.025 * sway; lamp.rotation.x = Math.sin(t * 0.45) * 0.015 * sway;
  shaftMat.uniforms.uTime.value = t; dustMat.uniforms.uTime.value = t * sway; grade.uniforms.uTime.value = t;
  composer.render();
  if (first) { first = false; document.getElementById('load').classList.add('done'); window.__ready = true; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
